# MegaLoc + SIFT + Global Positioner with Single partition.
# Based on unified_megaloc.yaml with SIFT detector/matcher swap + GP.

# @package _global_
_target_: gtsfm.scene_optimizer.SceneOptimizer

loader:
  _target_: gtsfm.loader.Olsson

image_pairs_generator:
  _target_: gtsfm.retriever.image_pairs_generator.ImagePairsGenerator
  global_descriptor:
    _target_: gtsfm.frontend.cacher.global_descriptor_cacher.GlobalDescriptorCacher
    global_descriptor_obj:
      _target_: gtsfm.frontend.global_descriptor.MegaLoc
  retriever:
    _target_: gtsfm.retriever.Similarity
    num_matched: 50
    min_score: 0.25
    use_diffusion_preprocessing: false
    use_mst_augmentation: false
  batch_size: 16

graph_partitioner:
  _target_: gtsfm.graph_partitioner.Single

cluster_optimizer:
  _target_: gtsfm.cluster_optimizer.Multiview

  correspondence_generator:
    _target_: gtsfm.frontend.correspondence_generator.det_desc_correspondence_generator.DetDescCorrespondenceGenerator

    detector_descriptor:
      _target_: gtsfm.frontend.cacher.detector_descriptor_cacher.DetectorDescriptorCacher
      detector_descriptor_obj:
        _target_: gtsfm.frontend.detector_descriptor.colmap_sift.ColmapSIFTDetectorDescriptor
        max_keypoints: 8192

    matcher:
      _target_: gtsfm.frontend.cacher.matcher_cacher.MatcherCacher
      matcher_obj:
        _target_: gtsfm.frontend.matcher.twoway_matcher.TwoWayMatcher
        ratio_test_threshold: 0.8

  two_view_estimator:
    _target_: gtsfm.two_view_estimator_cacher.TwoViewEstimatorCacher
    two_view_estimator_obj:
      _target_: gtsfm.two_view_estimator.TwoViewEstimator
      bundle_adjust_2view: True
      eval_threshold_px: 4
      ba_reproj_error_thresholds: [0.5]
      bundle_adjust_2view_maxiters: 100

      verifier:
        _target_: gtsfm.frontend.verifier.poselib_verifier.PoseLibVerifier
        estimation_threshold_px: 2

      triangulation_options:
        _target_: gtsfm.data_association.point3d_initializer.TriangulationOptions
        mode:
          _target_: gtsfm.data_association.point3d_initializer.TriangulationSamplingMode
          value: NO_RANSAC

      inlier_support_processor:
        _target_: gtsfm.two_view_estimator.InlierSupportProcessor
        min_num_inliers_est_model: 30
        min_inlier_ratio_est_model: 0.15
  save_gtsfm_data: True
  save_3d_viz: False
  save_two_view_viz: False
  pose_angular_error_thresh: 5
  multiview_optimizer:
    _target_: gtsfm.multi_view_optimizer.MultiViewOptimizer

    view_graph_estimator:
      _target_: gtsfm.view_graph_estimator.cycle_consistent_rotation_estimator.CycleConsistentRotationViewGraphEstimator
      edge_error_aggregation_criterion: MIN_EDGE_ERROR
      error_threshold: 7.0

    rot_avg_module:
      _target_: gtsfm.averaging.rotation.shonan.ShonanRotationAveraging
      weight_by_inliers: True
      # Set to true ONLY when Shonan hangs (e.g., Pantheon's repetitive colonnade
      # causes rank escalation). Skips Shonan's SDP iteration; uses chordal init
      # + Geman-McClure LM refinement (GLOMAP-style: weight_type=GEMAN_MCCLURE,
      # irls_loss_parameter_sigma=5°, max_num_irls_iterations=100).
      chordal_only: false

    trans_avg_module:
      _target_: gtsfm.averaging.translation.averaging_1dsfm.TranslationAveraging1DSFM
      robust_measurement_noise: True
      projection_sampling_method: SAMPLE_INPUT_MEASUREMENTS
      reject_outliers: False
      use_all_tracks_for_averaging: True
      use_relative_camera_poses: True

    data_association_module:
      _target_: gtsfm.data_association.data_assoc.DataAssociation
      min_track_len: 3
      triangulation_options:
        _target_: gtsfm.data_association.point3d_initializer.TriangulationOptions
        reproj_error_threshold: 10
        mode:
          _target_: gtsfm.data_association.point3d_initializer.TriangulationSamplingMode
          value: RANSAC_SAMPLE_UNIFORM
        max_num_hypotheses: 100
      save_track_patches_viz: False

    global_positioner:
      _target_: gtsfm.global_positioner.global_positioner.GlobalPositioner
      noise_sigma: 0.01
      huber_loss_scale: 0.1
      max_iterations: 50
      min_track_measurements: 3
      max_reproj_error: 10.0
      save_iteration_visualization: True
      # GLOMAP-style GP filter (uncalibrated cameras path, global_mapper.cc:233-281).
      # 3-pass sequential filter: 2x angular relaxed → min tri angle → 10x NORMALIZED reproj.
      # Way more permissive than the legacy 1° AND 10px filter — keeps more measurements
      # per track to give BA more constraints.
      use_glomap_filter: true
      glomap_max_angular_reproj_error_deg: 5.0
      glomap_min_tri_angle_deg: 1.0
      glomap_max_normalized_reproj_error: 0.01

    run_view_graph_calibration: true
    rotation_outlier_threshold_deg: 0

    bundle_adjustment_module:
      _target_: gtsfm.bundle.bundle_adjustment.BundleAdjustmentOptimizer
      # We use the LAST element as base; earlier elements ignored under the
      # GLOMAP outer-loop scheme. Filter threshold = scaling * last value.
      reproj_error_thresholds: [3]
      robust_ba_mode: "HUBER"
      shared_calib: False
      cam_pose3_prior_noise_sigma: 0.1
      calibration_prior_focal_sigma: 200.0
      measurement_noise_sigma: 1.0
      use_calibration_prior: true
      # GLOMAP-style outer iteration (global_mapper.cc:201-260):
      # Outer iter: run BA → filter @ scaling * 3px (scaling=3,2,1).
      # If filter dropped >0.1% tracks → re-BA next iter at tighter scaling.
      # If filter dropped <0.1% → tighten scaling without re-running BA.
      # Exit when no significant filter ever happens.
      num_outer_ba_iterations: 3
      outer_ba_min_track_change_frac: 0.001
      # Positions-only stage 1 BA is implemented but disabled by default:
      # tested on Brussels and slightly hurt — locking rotations to a
      # suboptimal RA basin prevents BA from escaping it. The single-stage
      # outer loop's bigger BA step is doing the real work on Brussels.
      positions_only_stage1: false
      # ── Phase 1 multi-view retriangulation ──
      # After the outer BA loop converges, re-triangulate the full 2D track set
      # (union-find tracks_2d) with the post-BA cameras, then run a final BA on
      # the augmented set. Recovers tracks dropped between union-find (~40K) and
      # OuterBA's filter passes (~15K). 2-view tracks are excluded — they
      # annihilate BA wall time in Python/GTSAM (under-conditioned LM directions).
      # See notes/phase1_vs_glomap_full_retri.md for the full architectural story.
      use_multi_view_retriangulation: true
      mv_retri_min_track_length: 3
      mv_retri_reproj_error_thresh: 10.0
      # 2-view admission disabled (min_track_length=3). Knobs kept for sweep configs.
      mv_retri_two_view_min_tri_angle_deg: 0.0
      mv_retri_two_view_max_count: 0

      # ── Post-BA per-observation reproj filter + min-tri-angle filter ──
      # Per-observation granularity: trims outlier MEASUREMENTS within a track,
      # keeps the track as long as ≥2 measurements survive. Replaces the prior
      # per-track filter that killed whole tracks for any aggregate-reproj outlier.
      # 6px / 0.5° are slightly looser than COLMAP's 4px / 1.5° defaults for
      # completeness — tight-baseline multi-view tracks add coverage without
      # affecting pose estimation.
      filter_max_reproj_error_px: 6.0
      filter_min_tri_angle_deg: 0.5

      # ── Post-BA 2-view track densification (visualization-only) ──
      # Cameras are FROZEN at this stage — no BA wall-time pathology, no effect on
      # pose-derived metrics (AUC/rot°/trans° are byte-identical). Triangulates the
      # 22,876 union-find 2-view tracks against the final cameras, gates by reproj +
      # tri-angle, ranks by tri-angle, takes top-N. Pure point cloud densification
      # for visualization / Gaussian-splat init / paper figures.
      densify_with_two_view_tracks: true
      # 4px reproj on FROZEN cameras is meaningful (cameras locked-in, no LM noise).
      densify_two_view_max_reproj_error_px: 4.0
      densify_two_view_min_tri_angle_deg: 3.0
      densify_two_view_max_count: 10000

  dense_multiview_optimizer: null
  gaussian_splatting_optimizer: null

