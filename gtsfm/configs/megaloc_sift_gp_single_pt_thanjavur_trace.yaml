# MegaLoc + SIFT + Global Positioner with Single partition + PIPELINE TRACE.
# Mirror of megaloc_sift_gp_single_pt.yaml but swaps two modules to their tracing
# variants so the visualizer gets COLMAP-format snapshots at every pipeline stage:
#
#   bundle_adjustment_tracing.BundleAdjustmentOptimizer
#     → dumps ba_input / outer_ba_N (pre+post) / retri / retri_final_ba
#       (endpoint-only — per-LM-iter dumps cost ~3 AUC@5 from manual lm.iterate()
#        drift vs vanilla lm.optimize(), not worth the visualizer fidelity)
#
#   global_positioner_tracing.GlobalPositioner
#     → dumps first 20 GP LM iters one-for-one + the final iter (this is where the
#       dramatic random-init → emerging-structure motion happens)
#
# Use this config ONLY when generating data for the visualizer. Expect slightly
# lower AUC@5 than the peak yaml because the tracing BA wrapper alters the BA
# execution path. For benchmark numbers, run megaloc_sift_gp_single_pt.yaml.
#
# Image colors for the visualizer are auto-detected from --images_dir or
# --dataset_dir CLI args (runner sets GTSFM_PIPELINE_TRACE_IMAGES_DIR in __init__,
# before dask workers fork). Override manually if needed:
#   export GTSFM_PIPELINE_TRACE_IMAGES_DIR=/path/to/images

# @package _global_
_target_: gtsfm.scene_optimizer.SceneOptimizer

loader:
  _target_: gtsfm.loader.Olsson

image_pairs_generator:
  # Skip MegaLoc + similarity matrix entirely. The COLMAP shared DB has the verified
  # pair set from exhaustive matching — recomputing descriptors to re-derive a less-
  # complete subset wastes ~5 min per run AND constructs a bigger Dask graph than
  # needed. Same approach validated on the peak yaml.
  _target_: gtsfm.retriever.image_pairs_generator.ImagePairsGenerator
  global_descriptor: null
  retriever:
    _target_: gtsfm.retriever.colmap_db_pairs_retriever.ColmapDbPairsRetriever
    database_path: /Users/kathir/Desktop/gtsfm/benchmarks/thanjavur/colmap_shared_threshold_0.800.db
  batch_size: 16

graph_partitioner:
  _target_: gtsfm.graph_partitioner.Single

cluster_optimizer:
  _target_: gtsfm.cluster_optimizer.Multiview

  # ColmapCorrespondenceGenerator reads keypoints + verified matches directly
  # from the COLMAP shared DB built earlier — skips SIFT extraction + matching
  # (saves ~1 hr on 529-image Thanjavur). Same two-view input as GLOMAP for
  # apples-to-apples back-end comparison.
  correspondence_generator:
    _target_: gtsfm.frontend.correspondence_generator.colmap_correspondence_generator.ColmapCorrespondenceGenerator
    database_path: /Users/kathir/Desktop/gtsfm/benchmarks/thanjavur/colmap_shared_threshold_0.800.db

  two_view_estimator:
    _target_: gtsfm.two_view_estimator_cacher.TwoViewEstimatorCacher
    two_view_estimator_obj:
      _target_: gtsfm.two_view_estimator.TwoViewEstimator
      bundle_adjust_2view: True
      eval_threshold_px: 4
      ba_reproj_error_thresholds: [0.5]
      bundle_adjust_2view_maxiters: 100

      verifier:
        _target_: gtsfm.frontend.verifier.poselib_verifier.PoseLibVerifier
        estimation_threshold_px: 2

      triangulation_options:
        _target_: gtsfm.data_association.point3d_initializer.TriangulationOptions
        mode:
          _target_: gtsfm.data_association.point3d_initializer.TriangulationSamplingMode
          value: NO_RANSAC

      inlier_support_processor:
        _target_: gtsfm.two_view_estimator.InlierSupportProcessor
        min_num_inliers_est_model: 30
        min_inlier_ratio_est_model: 0.25  # GLOMAP-matched (was 0.15)
  save_gtsfm_data: True
  save_3d_viz: False
  save_two_view_viz: False
  pose_angular_error_thresh: 5
  multiview_optimizer:
    _target_: gtsfm.multi_view_optimizer.MultiViewOptimizer

    view_graph_estimator:
      _target_: gtsfm.view_graph_estimator.cycle_consistent_rotation_estimator.CycleConsistentRotationViewGraphEstimator
      edge_error_aggregation_criterion: MIN_EDGE_ERROR
      error_threshold: 7.0

    rot_avg_module:
      _target_: gtsfm.averaging.rotation.shonan.ShonanRotationAveraging
      weight_by_inliers: True
      # Set to true ONLY when Shonan hangs (e.g., Pantheon's repetitive colonnade
      # causes rank escalation). Skips Shonan's SDP iteration; uses chordal init
      # + Geman-McClure LM refinement (GLOMAP-style: weight_type=GEMAN_MCCLURE,
      # irls_loss_parameter_sigma=5°, max_num_irls_iterations=100).
      chordal_only: true

    trans_avg_module:
      _target_: gtsfm.averaging.translation.averaging_1dsfm.TranslationAveraging1DSFM
      robust_measurement_noise: True
      projection_sampling_method: SAMPLE_INPUT_MEASUREMENTS
      reject_outliers: False
      use_all_tracks_for_averaging: True
      use_relative_camera_poses: True

    data_association_module:
      _target_: gtsfm.data_association.data_assoc.DataAssociation
      min_track_len: 3
      triangulation_options:
        _target_: gtsfm.data_association.point3d_initializer.TriangulationOptions
        reproj_error_threshold: 10
        mode:
          _target_: gtsfm.data_association.point3d_initializer.TriangulationSamplingMode
          value: RANSAC_SAMPLE_UNIFORM
        max_num_hypotheses: 100
      save_track_patches_viz: False

    global_positioner:
      _target_: gtsfm.global_positioner.global_positioner_tracing.GlobalPositioner
      noise_sigma: 0.01
      huber_loss_scale: 0.1
      max_iterations: 50
      min_track_measurements: 3
      max_reproj_error: 10.0
      save_iteration_visualization: True

    run_view_graph_calibration: true
    rotation_outlier_threshold_deg: 0
    # GLOMAP-style 2-pass RA + 10° per-edge filter + LCC re-prune. Validated on
    # peak yaml — got us from 519 cams (doubled gopuram) to 514 cams (single
    # pyramid, GLOMAP parity at 511). Drops bad rotations from BOTH RA input
    # AND v_corr_idxs so symmetric-feature false matches don't enter union-find.
    enable_double_ra_filter: true
    ra_filter_threshold_deg: 10.0

    bundle_adjustment_module:
      _target_: gtsfm.bundle.bundle_adjustment_tracing.BundleAdjustmentOptimizer
      # We use the LAST element as base; earlier elements ignored under the
      # GLOMAP outer-loop scheme. Filter threshold = scaling * last value.
      reproj_error_thresholds: [3]
      robust_ba_mode: "HUBER"
      shared_calib: False
      cam_pose3_prior_noise_sigma: 0.1
      calibration_prior_focal_sigma: 200.0
      measurement_noise_sigma: 1.0
      use_calibration_prior: true
      # GLOMAP-style outer iteration (global_mapper.cc:201-260):
      # Outer iter: run BA → filter @ scaling * 3px (scaling=3,2,1).
      # If filter dropped >0.1% tracks → re-BA next iter at tighter scaling.
      # If filter dropped <0.1% → tighten scaling without re-running BA.
      # Exit when no significant filter ever happens.
      num_outer_ba_iterations: 3
      outer_ba_min_track_change_frac: 0.001
      # Positions-only stage 1 BA is implemented but disabled by default:
      # tested on Brussels and slightly hurt — locking rotations to a
      # suboptimal RA basin prevents BA from escaping it. The single-stage
      # outer loop's bigger BA step is doing the real work on Brussels.
      positions_only_stage1: false
      # GLOMAP-style multi-view retriangulation: after the outer BA loop converges,
      # re-triangulate the full 2D track set from union-find with post-BA cameras,
      # then run a final BA on the augmented set. Recovers tracks that were dropped
      # between union-find (~46K) and BA's filter passes (~14K). See plan Phase 1.
      use_multi_view_retriangulation: true
      mv_retri_min_track_length: 3
      mv_retri_reproj_error_thresh: 10.0
      # Phase 2: COLMAP §4.3 recursive triangulation splitter. Each input 2D track
      # may produce multiple 3D points if union-find falsely merged independent
      # observations. Targets repetitive-feature scenes (Brussels bimodal, BM
      # colonnade, Pantheon columns). Default false — flip to true to test.
      # Splitter OFF — caused doubled-gopuram in earlier runs by over-splitting
      # symmetric tier carvings. Peak run with splitter off matched GLOMAP cleanly.
      mv_retri_use_recursive_splitter: false
      mv_retri_recursive_max_depth: 5
      # Post-retri-BA filter for cleaner viz cloud. Drops tracks with high reproj
      # error OR low triangulation angle (parallel-ray points → "comet streak"
      # artifacts). GLOMAP defaults: 4px / 1.5°. Bumped tri-angle to 2° on Thanjavur
      # since the temple's small lateral baseline produces lots of low-tri-angle
      # background points that visually clutter the gopuram silhouette.
      filter_max_reproj_error_px: 3.0
      filter_min_tri_angle_deg: 2.0
      # Trace dumps to <save_dir>/pipeline_trace/ as COLMAP-format folders for
      # the visualizer. Endpoint-only mode: per-outer-BA pre/post snapshots +
      # retri input/output (no per-LM-iter capture — that path costs ~3 AUC@5).
      save_pipeline_trace: true

  dense_multiview_optimizer: null
  gaussian_splatting_optimizer: null

